services:
  - type: web
    name: eg365-cloud
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: TZ
        value: Europe/Istanbul
      - key: GENERIC_TIMEZONE
        value: Europe/Istanbul
      - key: N8N_SECURE_COOKIE
        value: "false"
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_VERSION_NOTIFICATIONS_ENABLED
        value: "false"